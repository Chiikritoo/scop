<svg width="900" height="1500" viewBox="0 0 900 1500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="1500" fill="#ffffff"/>

  <text x="450" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">Pipeline de rendu OpenGL</text>
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#666666">Terminologie officielle - Khronos OpenGL Wiki, Rendering Pipeline Overview</text>

  <!-- Legend -->
  <rect x="600" y="95" width="18" height="18" rx="3" fill="#cfe0f5" stroke="#3577c9" stroke-width="1"/>
  <text x="625" y="109" font-size="13" fill="#1a1a1a">Etape programmable (shader)</text>
  <rect x="600" y="120" width="18" height="18" rx="3" fill="#e6e6e6" stroke="#8a8a8a" stroke-width="1"/>
  <text x="625" y="134" font-size="13" fill="#1a1a1a">Etape fixe (cablee GPU)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#555555" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Stage 1: Vertex Specification -->
  <rect x="150" y="160" width="600" height="80" rx="10" fill="#e6e6e6" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="450" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">1. Vertex Specification</text>
  <text x="450" y="208" text-anchor="middle" font-size="12.5" fill="#333333">VAO (recette d'interpretation) + VBO (donnees brutes en VRAM)</text>
  <text x="450" y="225" text-anchor="middle" font-size="12.5" fill="#333333">Definit le flux ordonne de vertices envoye au pipeline</text>
  <line x1="450" y1="240" x2="450" y2="268" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 2: Vertex Shader -->
  <rect x="150" y="270" width="600" height="70" rx="10" fill="#cfe0f5" stroke="#3577c9" stroke-width="1.2"/>
  <text x="450" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d2b4d">2. Vertex Shader (obligatoire)</text>
  <text x="450" y="318" text-anchor="middle" font-size="12.5" fill="#0d2b4d">1 vertex en entree, 1 vertex en sortie - transforme la position en clip space</text>
  <line x1="450" y1="340" x2="450" y2="368" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 3: Tessellation (optional) -->
  <rect x="150" y="370" width="600" height="70" rx="10" fill="#cfe0f5" stroke="#3577c9" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="450" y="398" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d2b4d">3. Tessellation (optionnel)</text>
  <text x="450" y="418" text-anchor="middle" font-size="12.5" fill="#0d2b4d">Tessellation Control Shader + Tessellation Evaluation Shader</text>
  <line x1="450" y1="440" x2="450" y2="468" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 4: Geometry Shader (optional) -->
  <rect x="150" y="470" width="600" height="70" rx="10" fill="#cfe0f5" stroke="#3577c9" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="450" y="498" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d2b4d">4. Geometry Shader (optionnel)</text>
  <text x="450" y="518" text-anchor="middle" font-size="12.5" fill="#0d2b4d">1 primitive en entree, 0 a N primitives en sortie</text>
  <line x1="450" y1="540" x2="450" y2="568" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 5: Vertex Post-Processing -->
  <rect x="150" y="570" width="600" height="130" rx="10" fill="#e6e6e6" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="450" y="598" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">5. Vertex Post-Processing</text>
  <text x="450" y="620" text-anchor="middle" font-size="12.5" fill="#333333">Transform Feedback (optionnel, sortie vers un buffer)</text>
  <text x="450" y="640" text-anchor="middle" font-size="12.5" fill="#333333">Primitive Assembly - regroupe les vertices en triangles/lignes/points</text>
  <text x="450" y="660" text-anchor="middle" font-size="12.5" fill="#333333">Clipping - decoupe aux frontieres du volume de vue</text>
  <text x="450" y="680" text-anchor="middle" font-size="12.5" fill="#333333">Perspective divide, puis Viewport Transform vers l'espace ecran</text>
  <line x1="450" y1="700" x2="450" y2="728" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 6: Rasterization -->
  <rect x="150" y="730" width="600" height="100" rx="10" fill="#e6e6e6" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="450" y="758" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">6. Rasterization</text>
  <text x="450" y="780" text-anchor="middle" font-size="12.5" fill="#333333">Face Culling (rejette les triangles mal orientes)</text>
  <text x="450" y="800" text-anchor="middle" font-size="12.5" fill="#333333">Scan conversion - genere des Fragments et interpole leurs attributs</text>
  <line x1="450" y1="830" x2="450" y2="858" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 7: Fragment Shader -->
  <rect x="150" y="860" width="600" height="70" rx="10" fill="#cfe0f5" stroke="#3577c9" stroke-width="1.2"/>
  <text x="450" y="888" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d2b4d">7. Fragment Shader</text>
  <text x="450" y="908" text-anchor="middle" font-size="12.5" fill="#0d2b4d">1 fragment en entree - sort couleur(s), profondeur, stencil</text>
  <line x1="450" y1="930" x2="450" y2="958" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 8: Per-Sample Operations -->
  <rect x="150" y="960" width="600" height="140" rx="10" fill="#e6e6e6" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="450" y="988" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">8. Per-Sample Operations</text>
  <text x="450" y="1010" text-anchor="middle" font-size="12.5" fill="#333333">Scissor Test -&gt; Stencil Test -&gt; Depth Test</text>
  <text x="450" y="1030" text-anchor="middle" font-size="12.5" fill="#333333">Blending (melange avec la couleur deja presente)</text>
  <text x="450" y="1050" text-anchor="middle" font-size="12.5" fill="#333333">Logical Operation, puis Write Mask</text>
  <text x="450" y="1070" text-anchor="middle" font-size="12" fill="#666666" font-style="italic">Ordre reel possible avant le fragment shader (early-Z) selon optimisation driver</text>
  <line x1="450" y1="1100" x2="450" y2="1128" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 9: Framebuffer -->
  <rect x="150" y="1130" width="600" height="80" rx="10" fill="#dcdcdc" stroke="#5a5a5a" stroke-width="1.4"/>
  <text x="450" y="1160" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">9. Framebuffer</text>
  <text x="450" y="1182" text-anchor="middle" font-size="12.5" fill="#333333">Image finale en VRAM, prete pour le swap vers l'ecran</text>

  <!-- Footer notes -->
  <line x1="150" y1="1250" x2="750" y2="1250" stroke="#cccccc" stroke-width="1"/>
  <text x="150" y="1280" font-size="12.5" fill="#333333">Notes de lecture :</text>
  <text x="150" y="1302" font-size="12" fill="#333333">- Seules 3 etapes sont programmables par toi : Vertex Shader (obligatoire), Tessellation et Geometry Shader (optionnels), Fragment Shader.</text>
  <text x="150" y="1322" font-size="12" fill="#333333">- Les etapes en pointille sont desactivees par defaut ; elles ne s'activent que si tu attaches un shader du type correspondant.</text>
  <text x="150" y="1342" font-size="12" fill="#333333">- Le Vertex Post-Processing, la Rasterization et les Per-Sample Operations sont cablees dans le silicium : non programmables, tres rapides.</text>
  <text x="150" y="1362" font-size="12" fill="#333333">- Source de reference : Khronos OpenGL Wiki, page "Rendering Pipeline Overview" (khronos.org/opengl/wiki).</text>

  <text x="150" y="1410" font-size="12" fill="#999999">Schema construit pour l'apprentissage OpenGL - Anis, 2026</text>
</svg>
